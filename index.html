<html lang="en">
  <head>
    <script>
      // Per AI Studio runtime guidelines (HMR: Disabled. Ignore WebSocket errors.)
      // Suppress Vite HMR WebSocket connection failure logs and uncaught error popups
      (function() {
        // Patch WebSocket prototype and constructor to suppress unhandled errors
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const ws = protocols ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            ws.addEventListener('error', function(e) {
              // Suppress unhandled event bubbling for vite-hmr websockets
              if (url && (url.includes('token=') || url.includes('vite') || protocols === 'vite-hmr')) {
                e.stopImmediatePropagation?.();
              }
            });
            return ws;
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        const origError = console.error;
        console.error = function(...args) {
          const msg = (args[0] && typeof args[0] === 'object' && args[0].message) ? args[0].message : String(args[0] || '');
          if (
            msg.includes('WebSocket closed without opened') ||
            msg.includes('[vite]') ||
            msg.includes('WebSocket') ||
            msg.includes('connection lost')
          ) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reasonMsg = (event.reason && (event.reason.message || event.reason.toString())) || '';
          if (
            reasonMsg.includes('WebSocket closed without opened') ||
            reasonMsg.includes('[vite]') ||
            reasonMsg.includes('WebSocket')
          ) {
            event.stopImmediatePropagation?.();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const errMsg = (event.message || '') + (event.error?.message || '');
          if (
            errMsg.includes('WebSocket closed without opened') ||
            errMsg.includes('[vite]') ||
            errMsg.includes('WebSocket')
          ) {
            event.stopImmediatePropagation?.();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
